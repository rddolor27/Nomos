name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: python tools/worldgen/vectors.py --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: |
          node tools/cli/src/main.ts --seed 42 --tier phone --ticks 1000 > "$RUNNER_TEMP/replay-1.txt"
          node tools/cli/src/main.ts --seed 42 --tier phone --ticks 1000 > "$RUNNER_TEMP/replay-2.txt"
          cat "$RUNNER_TEMP/replay-1.txt"
          diff "$RUNNER_TEMP/replay-1.txt" "$RUNNER_TEMP/replay-2.txt"
