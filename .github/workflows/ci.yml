name: CI

on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: python tools/worldgen/vectors.py --check
      - run: python tools/worldgen/mapfile.py --check
      - run: python tools/worldgen/export_map.py --check
      - run: python tools/sprites/test_skin_a.py
      - run: python tools/licenses.py --check
      - run: python tools/test_licenses.py
      - run: python tools/atlas/test_atlas.py
      - run: python tools/worldgen/goldens.py --check --seeds 3
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm names
      - run: pnpm depcruise
      - run: pnpm test
      - run: node packages/worldgen/scripts/engines.ts
      - run: node packages/worldgen/scripts/frozen.ts --check
      - run: node packages/worldgen/scripts/sweep.ts
      # The ledger gate: two days per tier with the money invariants checked every tick, so a lost cent exits non-zero.
      - run: for tier in phone phone-plus desktop; do node tools/cli/src/main.ts --seed 7 --tier "$tier" --ticks 2880; done
      # In this order: a Vite build empties dist/, so the atlas goes in after it, then every chunk is measured.
      - run: pnpm --filter @nomos/web build
      - run: python tools/atlas/build_atlas.py --out apps/web/dist/atlas
      - run: pnpm --filter @nomos/web size
      - run: node tools/bench/src/chunks.ts
      - run: |
          node tools/cli/src/main.ts --seed 42 --tier phone --ticks 1000 > "$RUNNER_TEMP/replay-1.txt"
          node tools/cli/src/main.ts --seed 42 --tier phone --ticks 1000 > "$RUNNER_TEMP/replay-2.txt"
          cat "$RUNNER_TEMP/replay-1.txt"
          diff "$RUNNER_TEMP/replay-1.txt" "$RUNNER_TEMP/replay-2.txt"

  # The renderer's specs in Chromium (WebGL2 on SwiftShader), Firefox and WebKit, on a runner with no GPU.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser
      # The report keeps each test's annotations and log, the frame budget's numbers among them, pass or fail.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/

  # The kernels, replay goldens and world generator stages under JavaScriptCore, the fifth engine after Node and the three browsers.
  bun:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3'
      - run: pnpm install --frozen-lockfile
      - run: bun packages/sim-core/scripts/engines.ts
      - run: bun packages/worldgen/scripts/engines.ts
