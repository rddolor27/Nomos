name: CI

on:
  push:
    branches: [main]

jobs:
  # Everything but the browser specs, as `pnpm check` runs it locally.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # The browser specs in Chromium only (WebGL2 on SwiftShader), on a runner with no GPU, while Nomos is a proof of concept.
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      # The app's web server builds the app, which writes its atlas pages with Pillow.
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r tools/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      # The report keeps each test's annotations and log, the frame budget's numbers among them, pass or fail.
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
