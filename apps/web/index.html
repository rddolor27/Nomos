<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Nomos</title>
    <link rel="icon" href="data:,">
    <style>
      html, body { margin: 0; background: #464c5e; color: #f6f0de; font: 15px/1.4 system-ui, sans-serif; }
      #hud { position: absolute; top: 0; left: 0; right: 0; z-index: 1; display: flex; flex-wrap: wrap; align-items: center;
        gap: .25rem 1rem; padding: .4rem .75rem; background: rgb(26 28 36 / .88); }
      #hud button { font: inherit; min-width: 5.5em; padding: .2rem .8rem; }
      #status { margin: 0; }
      #view { position: relative; height: 100vh; height: 100dvh; overflow: hidden; }
      #view:focus-visible { outline: 3px solid #f7c948; outline-offset: -3px; }
      #world { position: absolute; top: 0; left: 0; }
      #charts { padding: 1rem .75rem; }
    </style>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <header id="hud">
      <button id="play" type="button">Pause</button>
      <p id="status" role="alert"></p>
    </header>
    <main id="view" tabindex="0">
      <canvas id="world" role="img" aria-label="Town map with every agent as a dot"></canvas>
    </main>
    <section id="charts" aria-label="Charts"></section>
  </body>
</html>
